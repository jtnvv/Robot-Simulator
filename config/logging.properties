############################################################
#  	Logging configuration of the robotic factory simulator
############################################################

# Two handlers: the console and a log file.
handlers= java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Default global logging level.
.level= CONFIG

# The log file is stored in the config directory of the project (relative to the working directory).
java.util.logging.FileHandler.pattern = config/robotsim%u.log
java.util.logging.FileHandler.limit = 50000
java.util.logging.FileHandler.count = 1
java.util.logging.FileHandler.maxLocks = 100
java.util.logging.FileHandler.formatter = java.util.logging.XMLFormatter
java.util.logging.FileHandler.level = CONFIG

# Limit the messages that are printed on the console.
java.util.logging.ConsoleHandler.level = CONFIG
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
